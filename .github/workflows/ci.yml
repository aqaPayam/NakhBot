name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
      - name: Terraform formatting
        run: docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 fmt -check -recursive deploy/terraform

  postgres-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_DB: nakh
          POSTGRES_USER: nakh
          POSTGRES_PASSWORD: nakh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nakh -d nakh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NAKH_ENV: test
      NAKH_SERVICE_NAME: ci
      NAKH_RELEASE: ${{ github.sha }}
      NAKH_DATABASE_URL: postgresql://nakh:nakh_test@localhost:5432/nakh
      NAKH_TEST_DATABASE_URL: postgresql://nakh:nakh_test@localhost:5432/nakh
      NAKH_REDIS_URL: redis://localhost:6379
      NAKH_TEST_REDIS_URL: redis://localhost:6379
      NAKH_TELEGRAM_BOT_TOKEN_REF: fake
      NAKH_TELEGRAM_WEBHOOK_SECRET: 12345678901234567890123456789012
      NAKH_R2_ENDPOINT: https://r2.invalid
      NAKH_R2_BUCKET: test
      NAKH_R2_ACCESS_KEY_REF: fake
      NAKH_R2_SECRET_KEY_REF: fake
      NAKH_MEDIA_CDN_HOST: media.invalid
      NAKH_MEDIA_SIGNING_KEY_REF: fake
      PGHOST: localhost
      PGUSER: nakh
      PGDATABASE: nakh
      PGPASSWORD: nakh_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm test:integration
      - name: Migration immutability replay
        run: pnpm db:migrate
      - name: Backup and restore smoke
        run: bash deploy/scripts/restore-smoke.sh

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, telegram-gateway, worker, scheduler]
    steps:
      - uses: actions/checkout@v6
      - name: Build ${{ matrix.app }} image
        run: docker build --file deploy/docker/Dockerfile --build-arg APP=${{ matrix.app }} --tag nakh-${{ matrix.app }}:${{ github.sha }} .
