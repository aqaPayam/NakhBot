name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit:security
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
      - name: Terraform formatting
        run: terraform fmt -check -recursive deploy/terraform
      - name: Validate AWS bootstrap
        run: terraform -chdir=deploy/terraform/bootstrap init -backend=false && terraform -chdir=deploy/terraform/bootstrap validate
      - name: Validate AWS staging
        run: terraform -chdir=deploy/terraform/staging init -backend=false && terraform -chdir=deploy/terraform/staging validate
      - name: Validate local staging rehearsal
        run: docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.staging.yml --profile telemetry config --quiet

  postgres-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_DB: nakh
          POSTGRES_USER: nakh
          POSTGRES_PASSWORD: nakh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nakh -d nakh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NAKH_ENV: test
      NAKH_SERVICE_NAME: ci
      NAKH_RELEASE: ${{ github.sha }}
      NAKH_DATABASE_URL: postgresql://nakh:nakh_test@localhost:5432/nakh
      NAKH_TEST_DATABASE_URL: postgresql://nakh:nakh_test@localhost:5432/nakh
      NAKH_REDIS_URL: redis://localhost:6379
      NAKH_TEST_REDIS_URL: redis://localhost:6379
      NAKH_TELEGRAM_BOT_TOKEN_REF: fake
      NAKH_TELEGRAM_WEBHOOK_SECRET: 'ci-webhook-secret-not-a-real-secret-0001'
      NAKH_R2_ENDPOINT: https://r2.invalid
      NAKH_R2_BUCKET: test
      NAKH_R2_ACCESS_KEY_REF: fake
      NAKH_R2_SECRET_KEY_REF: fake
      NAKH_MEDIA_CDN_HOST: media.invalid
      NAKH_MEDIA_SIGNING_KEY_REF: NAKH_MEDIA_SIGNING_KEY
      PGHOST: localhost
      PGUSER: nakh
      PGDATABASE: nakh
      PGPASSWORD: nakh_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm test:integration
      - name: M1 concurrency load smoke
        run: pnpm test:m1-load-smoke
      - name: Migration immutability replay
        run: pnpm db:migrate
      - name: Backup and restore smoke
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash deploy/scripts/restore-smoke.sh

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, telegram-gateway, worker, scheduler]
    steps:
      - uses: actions/checkout@v6
      - name: Build ${{ matrix.app }} image
        run: docker build --file deploy/docker/Dockerfile --build-arg APP=${{ matrix.app }} --tag nakh-${{ matrix.app }}:${{ github.sha }} .
      - name: Verify non-root runtime image
        run: test "$(docker image inspect --format '{{.Config.User}}' nakh-${{ matrix.app }}:${{ github.sha }})" = "nakh"
      - name: Verify migration artifact
        if: matrix.app == 'api'
        run: |
          docker run --rm --entrypoint test nakh-api:${{ github.sha }} -f /app/node_modules/@nakh/persistence-postgres/dist/cli/migrate.js
          docker run --rm --entrypoint test nakh-api:${{ github.sha }} -d /app/migrations
